<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Pradux Vibrant Primary Gradient -->
    <linearGradient id="pradux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0033CC" />
    </linearGradient>
    
    <!-- Accent Electric Cyan/Blue -->
    <linearGradient id="electric-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Drop Shadow for contrast on both light and dark browser tabs -->
    <filter id="tab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTYPE: Pixelated 'P' Centered on Transparent Canvas -->
  <g transform="translate(15, 15)" filter="url(#tab-shadow)">
    <!-- Column Main Stem -->
    <rect x="0" y="0" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />
    <rect x="0" y="18" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />
    <rect x="0" y="36" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />
    <rect x="0" y="54" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />

    <!-- Top Loop Horizontal -->
    <rect x="18" y="0" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />
    <rect x="36" y="0" width="16" height="16" fill="url(#electric-grad)" rx="3.5" filter="url(#neon-glow)" />

    <!-- Right Curve Vertical -->
    <rect x="54" y="9" width="16" height="16" fill="url(#electric-grad)" rx="3.5" />
    <rect x="54" y="27" width="16" height="16" fill="url(#electric-grad)" rx="3.5" />

    <!-- Bottom Loop Return -->
    <rect x="36" y="36" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />
    <rect x="18" y="36" width="16" height="16" fill="url(#pradux-grad)" rx="3.5" />

    <!-- Pixel Accent Dots -->
    <rect x="36" y="18" width="16" height="16" fill="#00E0FF" opacity="0.95" rx="3.5" filter="url(#neon-glow)" />
    <rect x="18" y="54" width="10" height="10" fill="#0066FF" opacity="0.7" rx="2.5" />
  </g>
</svg>
