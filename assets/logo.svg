<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Pradux Primary Gradient -->
    <linearGradient id="pradux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="40%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00153D" />
    </linearGradient>
    
    <!-- Accent Electric Blue -->
    <linearGradient id="electric-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTYPE: Pixelated 'P' -->
  <g transform="translate(10, 10)">
    <!-- Column Main Stem -->
    <rect x="10" y="10" width="16" height="16" fill="url(#pradux-grad)" rx="2" />
    <rect x="10" y="28" width="16" height="16" fill="url(#pradux-grad)" rx="2" />
    <rect x="10" y="46" width="16" height="16" fill="url(#pradux-grad)" rx="2" />
    <rect x="10" y="64" width="16" height="16" fill="url(#pradux-grad)" rx="2" />

    <!-- Top Loop Horizontal -->
    <rect x="28" y="10" width="16" height="16" fill="url(#pradux-grad)" rx="2" />
    <rect x="46" y="10" width="16" height="16" fill="url(#electric-grad)" rx="2" filter="url(#neon-glow)" />

    <!-- Right Curve Vertical -->
    <rect x="64" y="19" width="16" height="16" fill="url(#electric-grad)" rx="2" />
    <rect x="64" y="37" width="16" height="16" fill="url(#electric-grad)" rx="2" />

    <!-- Bottom Loop Horizontal Return -->
    <rect x="46" y="46" width="16" height="16" fill="url(#pradux-grad)" rx="2" />
    <rect x="28" y="46" width="16" height="16" fill="url(#pradux-grad)" rx="2" />

    <!-- Pixel Accent Dots -->
    <rect x="46" y="28" width="16" height="16" fill="#0088FF" opacity="0.9" rx="3" filter="url(#neon-glow)" />
    <rect x="28" y="64" width="10" height="10" fill="#0052FF" opacity="0.4" rx="2" />
  </g>

  <!-- Pradux_blanco_sin_fondo TEXT: PRADUX -->
  <g transform="translate(110, 62)">
    <text font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="40" letter-spacing="4" fill="#FFFFFF">
      PRADUX
    </text>
    <text font-family="'Inter', sans-serif" font-weight="600" font-size="14" letter-spacing="7" fill="#0088FF" y="20" opacity="0.9">
      GROUP
    </text>
  </g>
</svg>
